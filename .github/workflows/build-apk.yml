
name: Build Etheral APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract Etheral project
        run: |
          unzip -q Etheral-Worldwide-Music-Android-Project.zip -d source

      - name: Build Etheral APK
        run: |
          gradle -p source --no-daemon assembleDebug

      - name: Upload Etheral APK
        uses: actions/upload-artifact@v4
        with:
          name: Etheral-APK
          path: source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
